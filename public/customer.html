<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pesan Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ================= STEP 1: PILIH MEJA (hanya muncul jika belum dari QR / belum pilih) ================= -->
  <div class="table-picker-screen" id="tablePickerScreen">
    <div class="table-picker-inner">
      <div class="tp-icon">🍽️</div>
      <h1>Selamat Datang</h1>
      <p class="tp-sub">Sebelum mulai memesan, silakan konfirmasi atau pilih nomor meja Anda.</p>
      <div class="table-grid" id="tableGridPicker">
        <div class="tp-loading">Memuat daftar meja...</div>
      </div>
      <p class="tp-hint">Meja abu-abu = sedang terisi. Ketuk nomor meja Anda untuk melanjutkan.</p>
    </div>
  </div>

  <!-- ================= STEP 2: MENU ================= -->
  <div id="orderingScreen" style="display:none;">
    <div class="topbar">
      <div class="topbar-row">
        <div>
          <div class="eyebrow">Sedang memesan</div>
          <h1>Menu Hari Ini</h1>
        </div>
        <button class="table-badge" id="changeTableBtn" type="button">
          <span class="tb-label">Meja</span>
          <span class="tb-num" id="tableBadgeNum">-</span>
        </button>
      </div>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>

    <div class="container">
      <div id="menuList"></div>

      <div class="section-title">Catatan untuk Dapur</div>
      <textarea class="note-input" id="customerNote" rows="2" placeholder="Contoh: pedas sedang, tanpa bawang, dll. (opsional)"></textarea>
      <div style="height:8px;"></div>
    </div>

    <!-- Cart bar mengambang, tap untuk buka ringkasan -->
    <button class="cart-bar" id="cartBarBtn" type="button" disabled>
      <span class="cart-bar-count" id="cartBarCount">0</span>
      <span class="cart-bar-text" id="cartBarText">Keranjang kosong</span>
      <span class="cart-bar-total" id="cartBarTotal"></span>
      <span class="cart-bar-arrow">›</span>
    </button>
  </div>

  <!-- ================= BOTTOM SHEET: RINGKASAN KERANJANG ================= -->
  <div class="sheet-backdrop" id="cartSheetBackdrop">
    <div class="sheet" id="cartSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2>Pesanan Anda</h2>
        <button class="sheet-close" id="closeCartSheet" type="button" aria-label="Tutup">✕</button>
      </div>
      <div class="sheet-body" id="cartItemsList"></div>
      <div class="sheet-footer">
        <div class="sheet-total-row">
          <span>Total</span>
          <span id="sheetTotalPrice">Rp0</span>
        </div>
        <button class="btn-primary btn-send" id="sendOrderBtn">Kirim Pesanan</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
